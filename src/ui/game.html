<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>火影忍者Online</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* 去掉 Chromium 默认焦点环（跟随系统强调色，会残留成黄框） */
    button:focus, button:focus-visible { outline: none; }
    :root {
      --bg1: #ffffff;
      --bg2: #f0fdfa;
      --border: #d7ece8;
      --text: #1e2a37;
      --sub: #7c8794;
      --btnBg: #ffffff;
      --btnHover: #f0fdfa;
      --btnBorder: #cfe3df;
      --separator: #dbe7e5;
      --accent: #14b8a6;
      --toolbarHeight: 44px;
      --uiScale: 1;
      --toolbarScale: 1;
      --sideTop: 44px;
      --sideHeight: calc(100vh - 44px);
      --sideFullHeight: 100vh;
    }
    body {
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: 'Microsoft YaHei', sans-serif;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 10px;
      height: var(--toolbarHeight);
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      flex-shrink: 0;
      position: relative;
      z-index: 900;
      zoom: var(--toolbarScale);
    }
    .tb-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .tb-right { display: flex; align-items: center; gap: 6px; -webkit-app-region: no-drag; }
    .ttl {
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .tbtn {
      height: 30px;
      min-width: 30px;
      padding: 0 9px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s;
      -webkit-app-region: no-drag;
    }
    .tbtn:hover { background: rgba(128,128,128,.16); }
    .tbtn.active { background: var(--accent); color: #fff; }
    body.fullscreen .toolbar { display: none; }
    body.fullscreen .tab-sidebar { top: 0; height: var(--sideFullHeight); }
    body.fullscreen .account-sidebar { top: 0; height: var(--sideFullHeight); }
    body.fullscreen .more-sidebar { top: 0; height: var(--sideFullHeight); }
    .tabs-container {
      display: none;
      align-items: center;
      gap: 2px;
      overflow: hidden;
      flex: 1;
      min-width: 0;
      -webkit-app-region: no-drag;
    }
    .tabs-list {
      display: flex;
      align-items: center;
      gap: 2px;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }
    /* 标签后的空白区域：可拖动窗口；drop 仍由外层 tabs-list 接管 */
    .tabs-drag-fill {
      flex: 1 1 0;
      min-width: 8px;
      align-self: stretch;
      -webkit-app-region: drag;
    }
    .tab {
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--btnBorder);
      border-radius: 999px;
      background: var(--btnBg);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex: 0 1 auto;
      min-width: 76px;
      max-width: 200px;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }
    .tab > span:first-child {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab:hover {
      background: var(--btnHover);
    }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .tab-close {
      font-size: 10px;
      opacity: 0.6;
      flex: 0 0 auto;
    }
    .tab-close:hover {
      opacity: 1;
      color: #e74c3c;
    }
    .tab.active .tab-close:hover {
      color: #fff;
    }
    .tab-add {
      height: 28px;
      width: 28px;
      border: 1px solid var(--btnBorder);
      border-radius: 999px;
      background: var(--btnBg);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .tab-add:hover {
      background: var(--btnHover);
    }
    .tab-sidebar {
      position: fixed;
      left: -220px;
      top: var(--sideTop);
      width: 220px;
      height: var(--sideHeight);
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      border-right: 1px solid var(--border);
      transition: left 0.25s ease;
      z-index: 900;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 8px rgba(0,0,0,0.08);
      zoom: var(--uiScale);
    }
    .tab-sidebar.visible {
      left: 0;
    }
    /* 侧边栏遮罩：盖住游戏区（工具栏以下），点击=优先关闭侧边栏 */
    .sidebar-backdrop {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--toolbarHeight);
      bottom: 0;
      z-index: 800;
      display: none;
      background: transparent;
    }
    .sidebar-backdrop.open { display: block; }
    body.fullscreen .sidebar-backdrop { top: 0; }
    /* 标签拖拽反馈 */
    .tab-placeholder { opacity: 0; pointer-events: none; }
    .tab-drag-ghost { position: fixed !important; z-index: 3000; pointer-events: none; opacity: .96; margin: 0 !important; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    .tab-drag-overlay { position: fixed; inset: 0; z-index: 1800; display: none; cursor: grabbing; }
    .tab-drag-overlay.active { display: block; }
    .tab.dragging, .tab-sidebar-item.dragging { opacity: .45; }
    .tab-drop-line {
      position: fixed;
      z-index: 2000;
      background: var(--accent);
      border-radius: 3px;
      pointer-events: none;
      display: none;
      box-shadow: 0 0 6px var(--shadow);
    }
    .tab-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab-sidebar-header .tab-sidebar-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }
    .tab-sidebar-add {
      height: 24px;
      width: 24px;
      border: 1px solid var(--btnBorder);
      border-radius: 4px;
      background: linear-gradient(var(--btnBg), var(--btnHover));
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: no-drag;
    }
    .tab-sidebar-add:hover {
      background: linear-gradient(var(--btnHover), #e8e8e8);
    }
    .tab-sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    .tab-sidebar-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 6px;
      margin-bottom: 4px;
      cursor: pointer;
      color: var(--text);
      font-size: 12px;
      background: transparent;
      -webkit-app-region: no-drag;
    }
    .tab-sidebar-item:hover {
      background: var(--btnHover);
    }
    .tab-sidebar-item.active {
      background: var(--accent);
      color: #fff;
    }
    .tab-sidebar-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 6px;
    }
    .tab-sidebar-close {
      font-size: 12px;
      opacity: 0.6;
      flex-shrink: 0;
    }
    .tab-sidebar-close:hover {
      opacity: 1;
      color: #e74c3c;
    }
    .tab-sidebar-item.active .tab-sidebar-close:hover {
      color: #fff;
    }
    /* 更多：右侧抽屉 */
    .more-sidebar {
      position: fixed;
      right: -300px;
      top: var(--sideTop);
      width: 300px;
      height: var(--sideHeight);
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      border-left: 1px solid var(--border);
      transition: right 0.3s ease;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      zoom: var(--uiScale);
      box-shadow: -2px 0 8px rgba(0,0,0,0.08);
    }
    .more-sidebar.visible { right: 0; }
    .more-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .more-sidebar-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .more-sidebar-close {
      border: none;
      background: transparent;
      color: var(--sub);
      font-size: 14px;
      cursor: pointer;
      width: 26px;
      height: 26px;
      border-radius: 8px;
    }
    .more-sidebar-close:hover { background: rgba(128,128,128,.16); color: var(--text); }
    .more-sidebar-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
    .more-sidebar-foot {
      flex-shrink: 0;
      padding: 8px 14px 14px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .about-link {
      color: var(--accent);
      font-size: 11.5px;
      cursor: pointer;
      text-decoration: underline;
    }
    .about-link:hover { opacity: .75; }
    .mi {
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(128,128,128,.06);
      border: 1px solid transparent;
      margin-bottom: 6px;
      transition: background .15s, border-color .15s;
    }
    .mi:hover { background: rgba(128,128,128,.16); border-color: var(--border); }
    .mi-key { font-size: 10.5px; color: var(--sub); font-weight: normal; }
    .more-sec { font-size: 10.5px; color: var(--sub); font-weight: 600; margin: 12px 10px 4px; }
    .more-sec:first-child { margin-top: 2px; }
    .more-opacity { padding: 10px 12px 6px; }
    .more-opacity-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .more-opacity-head b { font-size: 11.5px; color: var(--accent); }
    .more-opacity input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .more-speed { padding: 4px 12px 10px; }
    .more-speed-btns { display: flex; gap: 5px; }
    .more-speed-btns button {
      flex: 1 1 0;
      border: 1px solid var(--btnBorder);
      background: var(--btnBg);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 0;
      font-size: 11px;
      cursor: pointer;
    }
    .more-speed-btns button:hover { background: var(--btnHover); }
    .more-speed-btns button.active {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
      font-weight: 600;
    }
    .win-ctrls {
      display: flex;
      gap: 2px;
      margin-left: 4px;
    }
    .cbtn {
      width: 34px;
      height: 30px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s;
      -webkit-app-region: no-drag;
    }
    .cbtn:hover { background: rgba(128,128,128,.16); }
    .cbtn.close:hover { background: #ef4444; color: #fff; }
    .help-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      -webkit-app-region: no-drag;
    }
    .help-card {
      width: 460px;
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
      padding: 18px 20px 20px;
      color: var(--text);
    }
    .help-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .help-close {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 8px;
    }
    .help-close:hover { background: rgba(128,128,128,.16); }
    .help-sec { margin-bottom: 14px; }
    .help-sec:last-child { margin-bottom: 0; }
    .help-sec-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 5px;
    }
    .help-desc {
      font-size: 12.5px;
      line-height: 1.65;
      color: var(--sub);
      margin: 0 0 6px;
    }
    .help-kv {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12.5px;
      line-height: 1.6;
      margin: 4px 0;
    }
    .help-kv kbd, .help-sec-title kbd {
      flex: 0 0 auto;
      min-width: 88px;
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: rgba(128,128,128,.12);
      color: var(--text);
      font-family: Consolas, 'Microsoft YaHei', monospace;
      font-size: 11.5px;
      text-align: center;
      white-space: nowrap;
    }
    .webview-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      /* 16:9 舞台之外的留边统一用黑色，避免透出浅色页面背景 */
      background: #000;
    }
    .webview-wrap webview {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #fff;
      /* 固定为独立合成层：切换/缩放时少一次重绘，且让 CSS 缩放的纹理走合成器 */
      will-change: transform;
    }
    .webview-wrap webview.hidden {
      z-index: 0;
      pointer-events: none;
      visibility: hidden;   /* 让合成器跳过该层（布局与尺寸不变，不影响切回） */
    }
    .webview-wrap webview.paused {
      z-index: 0;
      pointer-events: none;
    }
    .account-sidebar {
      position: fixed;
      right: -280px;
      top: var(--sideTop);
      width: 280px;
      height: var(--sideHeight);
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      border-left: 1px solid var(--border);
      transition: right 0.3s ease;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      zoom: var(--uiScale);
    }
    .account-sidebar.visible {
      right: 0;
    }
    .account-sidebar-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }
    .account-sidebar-header h3 {
      color: var(--text);
      font-size: 14px;
      flex: 1;
      margin: 0;
    }
    .account-sidebar-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s, filter 0.2s;
    }
    .account-sidebar-add {
      background: var(--accent);
      color: #fff;
      font-weight: bold;
    }
    .account-sidebar-add:hover {
      filter: brightness(1.08);
    }
    .account-sidebar-launch-all {
      background: #10b981;
      color: #fff;
    }
    .account-sidebar-launch-all:hover {
      filter: brightness(1.08);
    }
    .account-sidebar-close {
      background: transparent;
      color: var(--sub);
      padding: 4px 8px;
    }
    .account-sidebar-close:hover {
      color: var(--text);
    }
    .account-sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .account-sidebar-item {
      display: block;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: rgba(128,128,128,.08);
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
    }
    .account-sidebar-item:hover {
      background: rgba(128,128,128,.14);
      border-color: var(--border);
    }
    .account-sidebar-head {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .account-sidebar-win-name {
      flex: 1;
      min-width: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-sidebar-tag {
      flex: 0 0 auto;
      padding: 1px 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 10px;
      color: var(--sub);
      white-space: nowrap;
    }
    .account-sidebar-qq {
      margin-top: 2px;
      color: var(--sub);
      font-size: 11px;
      letter-spacing: .2px;
    }
    .account-sidebar-status-dot {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sub);
      cursor: default;
    }
    .account-sidebar-status-dot.valid { background: #10b981; }
    .account-sidebar-status-dot.saved { background: #eab308; }
    .account-sidebar-status-dot.invalid { background: #ef4444; }
    .account-zone-select {
      flex: 1;
      min-width: 0;
      padding: 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }
    .account-sidebar-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .account-sidebar-action-btn {
      flex: 1;
      height: 26px;
      padding: 0 6px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      white-space: nowrap;
      background: rgba(128,128,128,.16);
      color: var(--text);
      transition: background 0.18s, filter 0.18s;
    }
    .account-sidebar-action-btn:hover {
      background: rgba(128,128,128,.28);
    }
    .account-sidebar-action-btn.open {
      flex: 1.2;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .account-sidebar-action-btn.open:hover {
      filter: brightness(1.08);
    }
    .account-sidebar-action-btn.delete:hover {
      background: rgba(239,68,68,.18);
      color: #ef4444;
    }
    .account-sidebar-hint {
      text-align: center;
      color: var(--sub);
      font-size: 12px;
      padding: 20px;
    }
    .add-account-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .add-account-box {
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      width: 320px;
      color: var(--text);
      box-shadow: 0 20px 60px rgba(0,0,0,0.28);
      zoom: var(--uiScale);
    }
    .add-account-box h3 {
      color: var(--text);
      font-size: 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    .add-account-box input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(128,128,128,.10);
      color: var(--text);
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }
    .add-account-box input:focus {
      border-color: var(--accent);
    }
    .add-account-box input::placeholder {
      color: var(--sub);
    }
    .add-account-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .add-account-actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-cancel {
      background: rgba(128,128,128,.20);
      color: var(--text);
    }
    .btn-cancel:hover {
      background: rgba(128,128,128,.30);
    }
    .btn-confirm {
      background: var(--accent);
      color: #fff;
      font-weight: bold;
    }
    .btn-confirm:hover {
      filter: brightness(1.08);
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="tb-left">
      <button class="tbtn" id="btn-tab-sidebar" title="标签栏">&#9776;</button>
      <span class="ttl" id="windowTitle">火影忍者Online</span>
      <div class="tabs-container" id="tabs-container">
        <div class="tabs-list" id="tabs-list"></div>
        <div class="tab-add" id="tab-add-h">+</div>
      </div>
    </div>
    <div class="tb-right">

      <button class="tbtn" id="btn-accounts" title="账号管理"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></button>

  <script>
    const container = document.getElementById('container');
    const tabSidebar = document.getElementById('tab-sidebar');
    const tabSidebarList = document.getElementById('tab-sidebar-list');
    const btnTabSidebar = document.getElementById('btn-tab-sidebar');
    const btnTabSidebarAdd = document.getElementById('tab-sidebar-add');
    const accountSidebarEl = document.getElementById('account-sidebar');
    const accountSidebarList = document.getElementById('account-sidebar-list');
    const moreSidebarEl = document.getElementById('moreSidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');
    let openSidebar = null;   // 'tabs' | 'accounts' | 'more' | null（侧边栏互斥）

    // 统一开关侧边栏：传同一个值再调用一次 = 关闭；传 null = 关闭
    function setSidebar(mode) {
      const next = (openSidebar === mode) ? null : mode;
      openSidebar = next;
      tabSidebar.classList.toggle('visible', next === 'tabs');
      if (accountSidebarEl) accountSidebarEl.classList.toggle('visible', next === 'accounts');
      if (moreSidebarEl) moreSidebarEl.classList.toggle('visible', next === 'more');
      if (sidebarBackdrop) sidebarBackdrop.classList.toggle('open', !!next);
      try { window.gameAPI.toggleSidebar(!!next); } catch (e) {}
      if (next === 'accounts') {
        try { window.gameAPI.getAccounts(); } catch (e) {}
      }
    }
    if (sidebarBackdrop) {
      sidebarBackdrop.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        setSidebar(null);
      });
    }
    // 点侧边栏和两个开关按钮以外的任何位置，也关闭侧边栏（工具栏区域走这里）
    document.addEventListener('mousedown', (e) => {
      if (!openSidebar) return;
      const t = e.target;
      if (!t || !t.closest) return;
      if (t.closest('#tab-sidebar') || t.closest('#account-sidebar') || t.closest('#moreSidebar') ||
          t.closest('#btn-tab-sidebar') || t.closest('#btn-accounts') || t.closest('#btn-more') ||
          t.closest('#sidebarBackdrop')) return;
      setSidebar(null);
    }, true);
    const tabsContainer = document.getElementById('tabs-container');
    const tabsList = document.getElementById('tabs-list');
    const tabAddH = document.getElementById('tab-add-h');
    const btnMore = document.getElementById('btn-more');
    const opacityRange = document.getElementById('opacityRange');
    const opacityVal = document.getElementById('opacityVal');
    const moreSpeedBtns = document.getElementById('moreSpeedBtns');
    const moreSpeedVal = document.getElementById('moreSpeedVal');
    const miTabMode = document.getElementById('miTabMode');
    const miMute = document.getElementById('miMute');

    let tabs = [];
    let activeTabId = null;
    let accounts = [];
    let currentGame = null;
    let diskCache = true;
    let windowSlot = 1;   // 由主进程 game-info 下发：本窗口的会话槽位（避免多窗口共用同一 partition）
    // 渲染分辨率（固定 16:9）：只决定游戏渲染像素，整体等比缩放到窗口；默认 1600×900
    let renderConfig = { width: 1600, height: 900 };
    let flashQuality = 'high';   // 游戏画面画质：high / medium / low
    let dragState = null;        // 标签拖拽状态
    let isMuted = false;
    let tabCounter = 0;
    let currentSpeed = 1;
    let isWindowActive = true;
    let tabDisplayMode = 'sidebar';

    function normalizeFlashQuality(v) {
      return (v === 'low' || v === 'medium' || v === 'high') ? v : 'high';
    }

    // 游戏最大只到 1920×1080；只保留 5 个常用档位，从高到低
    const RENDER_WIDTHS = [1920, 1600, 1440, 1280];
    function normalizeRenderConfig(cfg) {
      const c = cfg || {};
      const width = RENDER_WIDTHS.indexOf(parseInt(c.width, 10)) >= 0 ? parseInt(c.width, 10) : 1600;
      return { width: width, height: Math.round(width * 9 / 16) };
    }

    // 游戏窗口覆盖层缩放：只放大侧边栏/弹窗，不动工具栏与游戏内容
    let uiScale = 1;
    function applyUiScaleVars() {
      const scale = Math.max(1, Number(uiScale) || 1);
      const root = document.documentElement;
      const toolbar = 44;
      // 标题栏只做小幅放大，避免高分辨率下显得笨重
      const toolbarScale = Math.min(1.3, 1 + (scale - 1) * 0.45);
      const toolbarVisual = toolbar * toolbarScale;
      root.style.setProperty('--uiScale', scale);
      root.style.setProperty('--toolbarScale', toolbarScale);
      root.style.setProperty('--sideTop', (toolbarVisual / scale) + 'px');
      root.style.setProperty('--sideHeight', ((window.innerHeight - toolbarVisual) / scale) + 'px');
      root.style.setProperty('--sideFullHeight', (window.innerHeight / scale) + 'px');
    }
    window.addEventListener('resize', applyUiScaleVars);

    // IPC 通信
    const ipcRenderer = require('electron').ipcRenderer;

    // 游戏信息接口（与主进程通信）
    window.gameAPI = {
      // 请求账号列表
      getAccounts: function() {
        ipcRenderer.send('get-accounts-window');
      },
      // 手动整理旧账号（旧版多区合并数据拆成独立账号）
      repairAccounts: function() {
        return ipcRenderer.invoke('repair-accounts');
      },
      // 保存账号
      saveAccounts: function(accountList) {
        ipcRenderer.send('save-accounts-window', accountList);
      },
      // 添加账号
      addAccount: function(data) {
        ipcRenderer.send('add-account', data);
      },
      // 更新账号
      updateAccount: function(data) {
        ipcRenderer.send('update-account', data);
      },
      // 删除账号
      removeAccount: function(accountId) {
        ipcRenderer.send('remove-account', accountId);
      },
      // 启动账号
      launchAccount: function(accountId, zoneId) {
        ipcRenderer.send('launch-account-window', { accountId: accountId, zoneId: zoneId || '' });
      },
      setAccountZone: function(accountId, zoneId) {
        ipcRenderer.send('set-account-zone', accountId, zoneId);
      },
      // 填充账号到当前标签
      fillAccount: function(accountId) {
        const account = accounts.find(a => a.id === accountId);
        if (account) {
          const tab = tabs.find(t => t.id === activeTabId);
          if (tab && tab._webview) {
            injectQuickLogin(tab._webview, account.qq, account.qqPwd || '');
          }
        }
      },
      // 启动所有账号
      launchAllAccounts: function() {
        ipcRenderer.send('launch-all-accounts-window');
      },
      // 应用账号凭证（把 cookie 写回分区）
      applyCredential: function(partition, credential) {
        return ipcRenderer.invoke('apply-credential', partition, credential);
      },
      // 清除账号凭证
      clearCredential: function(accountId, zoneId) {
        return ipcRenderer.invoke('clear-credential', accountId, zoneId || '');
      },
      // 标记凭证失效（保留区服信息，重新登录后自动恢复）
      markCredentialExpired: function(accountId, zoneId) {
        return ipcRenderer.invoke('mark-credential-expired', accountId, zoneId || '');
      },
      // 切换侧边栏
      toggleSidebar: function(visible) {
        ipcRenderer.send('toggle-sidebar', visible);
      },
      // 显示/隐藏模态框
      showModal: function(show) {
        ipcRenderer.send('show-modal', show);
      },
      // 获取配置
      getConfig: function(key) {
        return new Promise((resolve) => {
          ipcRenderer.send('get-config', key);
          ipcRenderer.once('config-result', (event, value) => resolve(value));
        });
      },
      // 设置配置
      setConfig: function(key, value) {
        ipcRenderer.send('set-config', key, value);
      },
      // 变速
      setSpeed: function(speed) {
        ipcRenderer.send('set-game-speed', speed);
      },
      // 刷新当前标签（只影响本标签，不再全局杀 Flash 插件进程）
      // 网址调试（手动改 URL/参数发请求）
      openUrlTool: function() {
        ipcRenderer.send('open-url-tool');
      },
      refreshPage: function() {
        var tab = tabs.find(function(t) { return t.id === activeTabId; });
        if (!tab || !tab._webview) return;
        tab._manualRefresh = true;
        try {
          tab._webview.reloadIgnoringCache();
        } catch (e) {
          try { tab._webview.reload(); } catch (e2) {}
        }
        // 守卫期内忽略 plugin-crashed 的自动重载，避免双重 reload
        setTimeout(function() { tab._manualRefresh = false; }, 4000);
      },
      // 关闭窗口
      closeWindow: function() {
        ipcRenderer.send('close-window');
      },
      // 最小化
      minWindow: function() {
        ipcRenderer.send('min-window');
      },
      // 最大化
      maxWindow: function() {
        ipcRenderer.send('max-window');
      },
      // 老板键：隐藏 / 还原当前游戏窗口
      bossKey: function() {
        ipcRenderer.send('boss-key');
      },
      // 窗口透明度（20~100）
      setGameOpacity: function(pct) {
        ipcRenderer.send('set-game-opacity', pct);
      },
      // 新建标签
      newTab: function() {
        addTab();
      },
      // 关闭标签
      closeTab: function(index) {
        const tab = tabs.find(t => t.index === index);
        if (tab) {
          removeTab(tab.id);
        }
      },
      // 切换标签
      switchTab: function(index) {
        const tab = tabs.find(t => t.index === index);
        if (tab) {
          switchTab(tab.id);
        }
      },
      // 调试日志
      debugLog: function(level, category, message) {
        // 静默处理，不输出日志
      }
    };

    // 工具函数
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function isLoginPage(url) {
      if (!url) return false;
      return /ptlogin2\.qq\.com/i.test(url) ||
             /xui\.ptlogin2\.qq\.com/i.test(url) ||
             /ssl\.ptlogin2\.qq\.com/i.test(url) ||
             /login\.qq\.com/i.test(url) ||
             /qlogin\.qq\.com/i.test(url);
    }

    // 会话分区（决定 Cookie / localStorage → 登录态）：
    //  - 不落盘：内存分区，天然互不影响
    //  - 已知账号（从账号管理启动）：按 QQ 固定，换窗口/重启都认同一个账号
    //  - 手动登录：窗口槽位 * 100 + 标签槽位，保证多窗口之间不撞车
    //    （窗口1 → game-1, game-2…；窗口2 → game-101, game-102…）
    function computePartition(tab, account) {
      if (!diskCache) return 'tab-' + tab.id;
      const acc = account || tab._pendingAccount;
      if (acc && acc.qq) return 'persist:qq-' + acc.qq;
      return 'persist:game-' + (((windowSlot - 1) * 100) + (tab._tabSlot || tab.index));
    }

    // 分区在标签创建时定好（存 tab._partition），之后不再随重新编号变化
    function getPartition(tab) {
      return tab._partition || computePartition(tab);
    }

    // 标签槽位：取当前最小的空闲槽位，关标签时释放。
    // 用「空闲槽位」而不是 tab.index，避免关掉标签后重新编号导致新标签与存活标签撞分区。
    const usedTabSlots = {};
    function allocTabSlot() {
      let n = 1;
      while (usedTabSlots[n]) n++;
      usedTabSlots[n] = true;
      return n;
    }
    function freeTabSlot(n) {
      if (n) delete usedTabSlots[n];
    }

    // 注：Flash 的 quality / wmode 只在 embed 创建时读取，运行时 setAttribute 基本无效，
    // 因此画质统一由创建前挂载的 preload 决定（flash-quality-*.js），这里不再运行时注入。



    // 标签节流：冻结非活跃标签，资源全部给当前玩的标签
    function setTabThrottle(tab, throttled) {
      if (!tab || !tab._webview) return;
      try {
        const id = tab._webview.getWebContentsId();
        if (id) ipcRenderer.send('set-tab-throttle', { webContentsId: id, throttled: !!throttled });
      } catch (e) {}
    }

    // 快速登录注入
    function injectQuickLogin(webview, qqNumber, password) {
      const js = [
        '(function() {',
        '  var qqNum = ' + JSON.stringify(qqNumber) + ';',
        '  var pwd = ' + JSON.stringify(password || '') + ';',
        '  function fillInput(doc, selector, value) {',
        '    try {',
        '      var input = doc.querySelector(selector);',
        '      if (input && input.offsetParent !== null) {',
        '        var nativeSetter = Object.getOwnPropertyDescriptor(',
        '          window.HTMLInputElement.prototype, "value").set;',
        '        nativeSetter.call(input, value);',
        '        input.dispatchEvent(new Event("input", { bubbles: true }));',
        '        input.dispatchEvent(new Event("change", { bubbles: true }));',
        '        input.dispatchEvent(new KeyboardEvent("keyup", { bubbles: true }));',
        '        return true;',
        '      }',
        '    } catch(e) {}',
        '    return false;',
        '  }',
        '  function tryFillInputs(doc) {',
        '    var qqSelectors = ["#u", "input[name=\\"u\\"]", "#qq_num",',
        '      "input[placeholder*=\\"QQ\\"]", "input[placeholder*=\\"账号\\"]",',
        '      "input[placeholder*=\\"号码\\"]", "input[placeholder*=\\"邮箱\\"]",',
        '      "input[placeholder*=\\"email\\"]", "input[type=\\"email\\"]",',
        '      "input[type=\\"text\\"]"];',
        '    for (var i = 0; i < qqSelectors.length; i++) {',
        '      if (fillInput(doc, qqSelectors[i], qqNum)) break;',
        '    }',
        '    if (pwd) {',
        '      var pwdSelectors = ["#p", "input[name=\\"p\\"]",',
        '        "input[type=\\"password\\"]", "input[placeholder*=\\"密码\\"]"];',
        '      for (var i = 0; i < pwdSelectors.length; i++) {',
        '        if (fillInput(doc, pwdSelectors[i], pwd)) break;',
        '      }',
        '    }',
        '  }',
        '  function searchAllFrames(win) {',
        '    try { tryFillInputs(win.document); } catch(e) {}',
        '    try {',
        '      for (var i = 0; i < win.frames.length; i++) {',
        '        try { searchAllFrames(win.frames[i]); } catch(e) {}',
        '      }',
        '    } catch(e) {}',
        '  }',
        '  searchAllFrames(window);',
        '})()'
      ].join('\n');
      webview.executeJavaScript(js).catch(function() {});
    }

    // 尝试自动登录
    function tryPendingInject(tab) {
      if (!tab._pendingAccount) return;
      if (!tab._webview) return;

      const acc = tab._pendingAccount;
      injectQuickLogin(tab._webview, acc.qq, acc.qqPwd);

      // 持续尝试直到成功或超时
      if (!tab._injectTimer) {
        let attempts = 0;
        tab._injectTimer = setInterval(function() {
          attempts++;
          if (!tab._pendingAccount || !tab._webview) {
            clearInterval(tab._injectTimer);
            tab._injectTimer = null;
            return;
          }
          injectQuickLogin(tab._webview, acc.qq, acc.qqPwd);
          if (attempts >= 30) {
            clearInterval(tab._injectTimer);
            tab._injectTimer = null;
            tab._pendingAccount = null;
          }
        }, 2000);
      }
    }

    // 创建 webview
    async function createWebview(tab) {
      // 凭证直连：先把 cookie 写回该账号分区，再直接打开登录成功时的地址（跳过登录页）
      const pending = tab._pendingAccount;
      const zoneLoginUrl = pending && pending.credential && pending.credential.login_url ? pending.credential.login_url : '';
      // 已标记失效就不再注入旧 cookie（可能覆盖分区里仍有效的会话），直接走区服地址
      let cred = (pending && pending.credential && pending.credential.login_url &&
        !pending.credential.expired_at &&
        (!pending.credential.expires_at || new Date(pending.credential.expires_at).getTime() > Date.now()))
        ? pending.credential : null;
      if (cred) {
        let ok = false;
        try { ok = await window.gameAPI.applyCredential(getPartition(tab), cred); } catch (e) { ok = false; }
        if (!ok) cred = null;
      }
      tab._usingCredential = !!cred;

      const targetUrl = cred ? cred.login_url : (zoneLoginUrl || (currentGame ? currentGame.url : 'https://huoying.qq.com/'));
      const webview = document.createElement('webview');
      // 关键：Flash 在页面加载时按当时的逻辑视口初始化舞台。
      // 先挂 about:blank，等 guest 就绪、把页面缩放（逻辑宽度=1920）设好后再加载真实地址，
      // 否则游戏会按当前窗口尺寸布局，之后再缩放就会变成裁切/发虚的画面。
      tab._stageW = normalizeRenderConfig(renderConfig).width;
      tab._webview = webview;
      paintStage(tab);

      webview.setAttribute('plugins', '');
      // 不设置 allowpopups，阻止 window.open 弹窗
      webview.setAttribute('partition', getPartition(tab));
      // nativeWindowOpen=no 阻止原生窗口打开
      webview.setAttribute('webpreferences', 'allowRunningInsecureContent=yes,webSecurity=no,nativeWindowOpen=no,backgroundThrottling=no');
      // Flash 的 quality 必须在 embed 创建前改好：按配置挂 preload（主 frame）
      // QQ游戏大厅入口的内嵌 iframe 由主进程 CDP 注入兜底
      if (flashQuality === 'low' || flashQuality === 'medium') {
        const preloadFile = flashQuality === 'low' ? 'flash-quality-low-preload.js' : 'flash-quality-medium-preload.js';
        webview.setAttribute('preload', new URL(preloadFile, document.baseURI).href);
      }
      webview.src = 'about:blank';
      webview.dataset.tabId = tab.id;

      if (tab.id !== activeTabId) {
        webview.classList.add('hidden');
      }

      // 阻止新窗口/弹窗，在当前 webview 中打开
      webview.addEventListener('new-window', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.url) {
          webview.loadURL(e.url);
        }
        return false;
      });

      // 阻止页面内导航打开新窗口
      webview.addEventListener('will-navigate', (e) => {
        // 正常导航，不处理
      });

      webview.addEventListener('did-navigate', (e) => {
        // 凭证直连后如果被重定向到登录页 → 凭证失效：打标记并回退官方登录
        if (tab._usingCredential && isLoginPage(e.url)) {
          tab._usingCredential = false;
          updateReloginButton();
          const acc = tab._pendingAccount;
          if (acc && acc.id) {
            try { window.gameAPI.markCredentialExpired(acc.id, (acc.credential && acc.credential.zone_id) || ''); } catch (err) {}
            if (acc.credential) {
              acc.credential.expired_at = new Date().toISOString();
            }
          }
          setTimeout(() => {
            try { webview.loadURL(currentGame ? currentGame.url : 'https://huoying.qq.com/'); } catch (err) {}
          }, 120);
          return;
        }
        // 导航后页面缩放可能被重置：立刻重新应用，保证游戏始终按 1920 逻辑宽度布局
        tab._appliedZoom = 0;
        paintStage(tab);
        tryPendingInject(tab);
      });

      webview.addEventListener('did-navigate-in-page', () => {
        tryPendingInject(tab);
      });

      webview.addEventListener('did-stop-loading', () => {
        tryPendingInject(tab);
        // 页面导航后 zoomFactor 可能被重置，强制本标签重算一次
        tab._appliedZoom = 0;
        tab._renderKey = null;
        applyRenderConfig();
        // QQ游戏大厅入口被拦（403 Forbidden）时，自动回退到官网入口，避免停在错误页
        try {
          const cur = webview.getURL() || '';
          if (/social_hall\/app_frame/i.test(cur)) {
            webview.executeJavaScript('(document.body && document.body.innerText || "").slice(0, 80)').then(function (txt) {
              if (txt && txt.indexOf('Forbidden') >= 0) {
                window.gameAPI.debugLog('warn', 'load', 'QQ游戏大厅入口被拒绝(403)，自动回退官网入口');
                try { webview.loadURL('https://huoying.qq.com/'); } catch (e) {}
              }
            }).catch(function () {});
          }
        } catch (e) {}
      });

      webview.addEventListener('did-start-loading', () => {
        if (isMuted) {
          try { webview.setAudioMuted(true); } catch (e) {}
        }
      });

      // 处理插件崩溃（包括 Flash）
      webview.addEventListener('plugin-crashed', (e) => {
        window.gameAPI.debugLog('error', 'webview', '插件崩溃: ' + (e.name || 'unknown'));
        if (tab._manualRefresh) return; // 手动刷新已接管，避免双重 reload
        // 尝试刷新页面恢复 Flash
        setTimeout(() => {
          if (tab._webview && !tab._webview.isCrashed()) {
            tab._webview.reload();
          }
        }, 1000);
      });

      // 处理页面加载失败
      webview.addEventListener('did-fail-load', (e) => {
        if (e.errorCode !== -3) { // -3 是 ERR_ABORTED，通常忽略
          window.gameAPI.debugLog('error', 'webview', '加载失败: ' + e.errorDescription + ' (' + e.errorCode + ')');
        }
      });

      // 处理渲染进程崩溃
      webview.addEventListener('crashed', (e) => {
        window.gameAPI.debugLog('error', 'webview', '渲染进程崩溃');
      });

      tab._webview = webview;
      // about:blank 的 guest 就绪后再加载真实地址：此时页面缩放已经设好，Flash 会按 1920 逻辑宽度初始化
      let targetLoaded = false;
      const startTargetLoad = function () {
        if (targetLoaded) return;
        targetLoaded = true;
        try { webview.removeEventListener('dom-ready', onBlankReady); } catch (e) {}
        try { paintStage(tab); } catch (e) {}
        try { webview.loadURL(targetUrl); } catch (e) {}
      };
      const onBlankReady = function () { startTargetLoad(); };
      webview.addEventListener('dom-ready', onBlankReady);

      container.appendChild(webview);
      tab._renderKey = null;
      paintStage(tab);
      // 兜底：about:blank 的 dom-ready 没触发也要加载
      setTimeout(startTargetLoad, 800);
    }

    // 添加标签
    function addTab(name, account) {
      tabCounter++;
      const tab = {
        id: 'tab-' + Date.now() + '-' + tabCounter,
        index: tabs.length + 1,
        name: name || '窗口' + (tabs.length + 1),
        _webview: null,
        _pendingAccount: account || null,
        _account: account || null,
        _injectTimer: null
      };

      tabs.push(tab);
      // 槽位 + 分区名都在创建时确定一次，之后 removeTab 的重新编号不再影响它们
      tab._tabSlot = allocTabSlot();
      tab._partition = computePartition(tab, account);
      createWebview(tab);
      switchTab(tab.id);
      renderTabs();

      window.gameAPI.debugLog('info', 'launcher', '启动: ' + tab.name);
      return tab;
    }

    // 移除标签
    function removeTab(tabId) {
      const idx = tabs.findIndex(t => t.id === tabId);
      if (idx === -1) return;

      const tab = tabs[idx];

      // 清理定时器
      if (tab._injectTimer) {
        clearInterval(tab._injectTimer);
        tab._injectTimer = null;
      }

      // 释放槽位，供后续新建标签复用（不会与存活标签撞分区）
      freeTabSlot(tab._tabSlot);
      tab._tabSlot = null;

      // 移除 webview：先显式停掉并清监听，促使 guest 与 Flash 插件进程及时回收
      if (tab._webview) {
        try { tab._webview.stop(); } catch (e) {}
        try { tab._webview.removeAllListeners(); } catch (e) {}
        try { tab._webview.src = 'about:blank'; } catch (e) {}
        if (tab._webview.parentNode) {
          tab._webview.parentNode.removeChild(tab._webview);
        }
        tab._webview = null;
      }

      tabs.splice(idx, 1);

      // 关闭最后一个标签时不关窗口，自动补一个新标签
      if (tabs.length === 0) {
        activeTabId = null;
        addTab();
        return;
      }

      // 如果关闭的是当前标签，切换到前一个
      if (activeTabId === tabId) {
        const newIdx = Math.max(0, idx - 1);
        switchTab(tabs[newIdx].id);
      }

      // 重新编号
      tabs.forEach((t, i) => {
        t.index = i + 1;
      });

      renderTabs();
      window.gameAPI.debugLog('info', 'launcher', '关闭: ' + tab.name);
    }

    // 切换标签
    function switchTab(tabId) {
      if (activeTabId === tabId) return;

      const prevTab = tabs.find(t => t.id === activeTabId);
      const nextTab = tabs.find(t => t.id === tabId);

      activeTabId = tabId;

      // 使用 CSS 控制显示/隐藏，而非销毁
      if (prevTab && prevTab._webview) {
        prevTab._webview.classList.add('hidden');
        try { prevTab._webview.setAudioMuted(true); } catch (e) {}
        setTabThrottle(prevTab, true);   // 冻结旧标签
      }
      if (nextTab && nextTab._webview) {
        nextTab._webview.classList.remove('hidden');
        try { nextTab._webview.setAudioMuted(isMuted); } catch (e) {}
        setTabThrottle(nextTab, false);  // 新标签全速
      }

      renderTabs();
    }

    function updateReloginButton() {
      const btn = document.getElementById('btn-relogin');
      if (!btn) return;
      const active = tabs.find(t => t.id === activeTabId);
      btn.style.display = (active && active._usingCredential) ? '' : 'none';
    }

    // 渲染标签（侧边栏 + 顶部任务栏）
    function renderTabs() {
      tabSidebarList.innerHTML = '';
      tabsList.innerHTML = '';

      tabs.forEach(tab => {
        const item = document.createElement('div');
        item.className = 'tab-sidebar-item' + (tab.id === activeTabId ? ' active' : '');
        item.dataset.tab = tab.index;
        item.dataset.tabId = tab.id;
        item.innerHTML = '<span class="tab-sidebar-name">' + escapeHtml(tab.name) + '</span><span class="tab-sidebar-close" data-tab="' + tab.index + '">×</span>';
        bindTabDrag(item, tab);
        tabSidebarList.appendChild(item);

        const tabEl = document.createElement('div');
        tabEl.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
        tabEl.dataset.tab = tab.index;
        tabEl.dataset.tabId = tab.id;
        tabEl.title = tab.name;
        tabEl.innerHTML = '<span>' + escapeHtml(tab.name) + '</span><span class="tab-close" data-tab="' + tab.index + '">×</span>';
        bindTabDrag(tabEl, tab);
        tabsList.appendChild(tabEl);
      });

      // 标签后的空白填充：留出可拖动窗口的区域（不算拖拽项）
      const dragFill = document.createElement('div');
      dragFill.className = 'tabs-drag-fill';
      tabsList.appendChild(dragFill);
      updateReloginButton();
    }

    // 拖拽：同一栏内拖动 = 调整顺序（不拆窗口）
    let dropLineEl = null;
    function getDropLine() {
      if (!dropLineEl) {
        dropLineEl = document.createElement('div');
        dropLineEl.className = 'tab-drop-line';
        document.body.appendChild(dropLineEl);
      }
      return dropLineEl;
    }
    function hideDropLine() { if (dropLineEl) dropLineEl.style.display = 'none'; }

    // 计算插入位置时排除正在拖动的项，否则第一项往下拖会被 `from < insertIndex` 抵消
    function getDragItems(listEl) {
      return Array.prototype.slice.call(listEl.children).filter(function (x) {
        if (!x.dataset) return false;
        if (x.classList && x.classList.contains('tab-placeholder')) return false;
        if (x.dataset.tabId) return !dragState || x.dataset.tabId !== dragState.tabId;
        if (x.dataset.accountId) return !dragState || x.dataset.accountId !== dragState.accountId;
        return false;
      });
    }

    function computeDropIndex(listEl, vertical, clientX, clientY) {
      const items = getDragItems(listEl);
      const rect = listEl.getBoundingClientRect();
      const pos = vertical ? clientY : clientX;
      let idx = items.length;
      for (let i = 0; i < items.length; i++) {
        const r = items[i].getBoundingClientRect();
        const mid = vertical ? (r.top + r.height / 2) : (r.left + r.width / 2);
        if (pos < mid) { idx = i; break; }
      }
      return { idx: idx, items: items, rect: rect };
    }

    function showDropLine(listEl, vertical, info) {
      const line = getDropLine();
      const items = info.items;
      const rect = info.rect;
      line.style.display = 'block';
      if (vertical) {
        // 侧边栏是竖排：画一条横线
        let y;
        if (!items.length) y = rect.top + 10;
        else if (info.idx <= 0) y = items[0].getBoundingClientRect().top - 2;
        else if (info.idx >= items.length) y = items[items.length - 1].getBoundingClientRect().bottom + 1;
        else y = (items[info.idx - 1].getBoundingClientRect().bottom + items[info.idx].getBoundingClientRect().top) / 2;
        line.style.left = (rect.left + 8) + 'px';
        line.style.top = (y - 1) + 'px';
        line.style.width = Math.max(40, rect.width - 16) + 'px';
        line.style.height = '3px';
      } else {
        // 顶栏是横排：画一条竖线（和 Chrome 一样）
        let x;
        if (!items.length) x = rect.left + 4;
        else if (info.idx <= 0) x = items[0].getBoundingClientRect().left - 2;
        else if (info.idx >= items.length) x = items[items.length - 1].getBoundingClientRect().right + 1;
        else x = (items[info.idx - 1].getBoundingClientRect().right + items[info.idx].getBoundingClientRect().left) / 2;
        const h = items.length ? items[0].getBoundingClientRect().height : rect.height;
        line.style.left = (x - 1) + 'px';
        line.style.top = (rect.top + (rect.height - h) / 2) + 'px';
        line.style.width = '3px';
        line.style.height = h + 'px';
      }
    }

    function bindTabDrag(el, tab) {
      el.draggable = true;
      el.addEventListener('dragstart', function (e) {
        const r = el.getBoundingClientRect();
        dragState = { tabId: tab.id, dropped: false, hidePending: true, over: null, preview: null, lastX: e.clientX, lastY: e.clientY, sourceEl: el, placeholder: null };
        dragState.prevActiveEls = Array.prototype.slice.call(document.querySelectorAll('.tab.active, .tab-sidebar-item.active')).filter(function (x) { return x !== el; });
        dragState.prevActiveEls.forEach(function (x) { x.classList.remove('active'); });
        if (!el.classList.contains('active')) { el.classList.add('active'); dragState.sourceActiveAdded = true; }
        try {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', tab.id);
          // 原生拖拽图设为透明，改用下面自己画的 ghost，才能把它限制在标签栏内
          const blank = document.createElement('img');
          blank.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
          blank.style.position = 'fixed';
          blank.style.left = '-10px';
          blank.style.top = '-10px';
          blank.style.width = '1px';
          blank.style.height = '1px';
          document.body.appendChild(blank);
          e.dataTransfer.setDragImage(blank, 0, 0);
          setTimeout(function () { if (blank.parentNode) blank.parentNode.removeChild(blank); }, 0);
        } catch (err) {}
        // 插入一个同尺寸占位块，再把原标签隐藏：拖动时其它标签会实时让位
        const cs = window.getComputedStyle(el);
        const ph = document.createElement('div');
        ph.className = 'tab-placeholder';
        ph.style.width = r.width + 'px';
        ph.style.height = r.height + 'px';
        ph.style.flex = '0 0 auto';
        ph.style.margin = cs.margin;
        ph.style.boxSizing = 'border-box';
        dragState.placeholder = ph;
        // 跟随鼠标的 ghost（只允许在标签栏矩形内移动）
        const ghost = el.cloneNode(true);
        ghost.classList.add('tab-drag-ghost');
        ghost.classList.add('active');
        ghost.classList.remove('hidden', 'dragging');
        ghost.style.width = r.width + 'px';
        ghost.style.height = r.height + 'px';
        ghost.style.left = r.left + 'px';
        ghost.style.top = r.top + 'px';
        ghost.style.boxSizing = 'border-box';
        ghost.style.margin = '0';
        document.body.appendChild(ghost);
        dragState.ghost = ghost;
        dragState.ghostW = r.width;
        dragState.ghostH = r.height;
        dragState.grabDX = e.clientX - r.left;
        dragState.grabDY = e.clientY - r.top;
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', function (e) {
        el.classList.remove('dragging');
        cleanupDragPlaceholder();
        hideDropLine();
        const st = dragState;
        dragState = null;
        if (!st || st.dropped) return;
        // 偶尔 drop 事件没触发：只要最终位置还在标签栏里，就按最后预览的位置排序；栏外松手则不动
        if (st.over) {
          const r = st.over.rect;
          const fx = (e && typeof e.clientX === 'number') ? e.clientX : st.lastX;
          const fy = (e && typeof e.clientY === 'number') ? e.clientY : st.lastY;
          if (fx >= r.left && fx <= r.right && fy >= r.top && fy <= r.bottom) {
            reorderTab(st.tabId, (st.preview && st.preview.listEl === st.over.listEl) ? st.preview.idx : st.over.idx);
            if (activeTabId !== st.tabId) switchTab(st.tabId);
          }
        }

      });
    }

    function cleanupDragPlaceholder() {
      const st = dragState;
      if (!st) return;
      if (st.placeholder && st.placeholder.parentNode) st.placeholder.parentNode.removeChild(st.placeholder);
      if (st.sourceEl) st.sourceEl.style.display = '';
      st.placeholder = null;
      if (st.ghost && st.ghost.parentNode) st.ghost.parentNode.removeChild(st.ghost);
      hideDragOverlay();
      st.ghost = null;
      if (st.sourceActiveAdded && st.sourceEl) st.sourceEl.classList.remove('active');
      if (st.prevActiveEls) st.prevActiveEls.forEach(function (x) { if (x && x.parentNode) x.classList.add('active'); });
    }

    let dragOverlayEl = null;
    function getDragOverlay() {
      if (!dragOverlayEl) {
        dragOverlayEl = document.createElement('div');
        dragOverlayEl.className = 'tab-drag-overlay';
        dragOverlayEl.addEventListener('dragover', onOverlayDragOver);
        dragOverlayEl.addEventListener('drop', onOverlayDrop);
        document.body.appendChild(dragOverlayEl);
      }
      return dragOverlayEl;
    }
    function showDragOverlay() { getDragOverlay().classList.add('active'); }
    function hideDragOverlay() { if (dragOverlayEl) dragOverlayEl.classList.remove('active'); }

    function updateDragAt(listEl, vertical, clientX, clientY) {
      if (!dragState) return;
      if (dragState.hidePending) {
        dragState.hidePending = false;
        const src = dragState.sourceEl;
        const ph = dragState.placeholder;
        if (src && ph && src.parentNode) {
          src.parentNode.insertBefore(ph, src);
          src.style.display = 'none';
        }
      }
      // ghost 只夹在源标签栏内，鼠标跑到游戏画面时它停在边缘
      if (dragState.ghost) {
        const src = dragState.sourceEl;
        const lr = (src && src.parentNode ? src.parentNode : listEl).getBoundingClientRect();
        let left = clientX - dragState.grabDX;
        let top = clientY - dragState.grabDY;
        left = Math.max(lr.left, Math.min(left, lr.right - dragState.ghostW));
        top = Math.max(lr.top, Math.min(top, lr.bottom - dragState.ghostH));
        dragState.ghost.style.left = left + 'px';
        dragState.ghost.style.top = top + 'px';
      }
      // 鼠标在栏外时 computeDropIndex 会自然夹到第一/最后，拖动不会中断
      const info = computeDropIndex(listEl, vertical, clientX, clientY);
      dragState.lastX = clientX;
      dragState.lastY = clientY;
      dragState.over = { listEl: listEl, vertical: vertical, idx: info.idx, rect: info.rect };
      if (dragState.placeholder && dragState.placeholder.parentNode === listEl) {
        listEl.insertBefore(dragState.placeholder, info.items[info.idx] || null);
        dragState.preview = { listEl: listEl, idx: info.idx };
        hideDropLine();
      } else {
        showDropLine(listEl, vertical, info);
      }
    }

    function finishDrag() {
      if (!dragState) return;
      const st = dragState;
      st.dropped = true;
      const idx = st.preview ? st.preview.idx : (st.over ? st.over.idx : 0);
      cleanupDragPlaceholder();
      hideDropLine();
      hideDragOverlay();
      if (st.accountId) {
        reorderAccount(st.accountId, idx);
      } else {
        reorderTab(st.tabId, idx);
        if (activeTabId !== st.tabId) switchTab(st.tabId);
      }
    }

    function onOverlayDragOver(e) {
      if (!dragState) return;
      e.preventDefault();
      try { e.dataTransfer.dropEffect = 'move'; } catch (err) {}
      const src = dragState.sourceEl;
      if (!src || !src.parentNode) return;
      const listEl = src.parentNode;
      const vertical = (listEl === tabSidebarList || listEl === accountSidebarList);
      updateDragAt(listEl, vertical, e.clientX, e.clientY);
    }

    function onOverlayDrop(e) {
      if (!dragState) return;
      e.preventDefault();
      finishDrag();
    }

    function bindDropZone(listEl, vertical) {
      listEl.addEventListener('dragover', function (e) {
        if (!dragState) return;
        e.preventDefault();
        try { e.dataTransfer.dropEffect = 'move'; } catch (err) {}
        // 第一次进入列表后，用全屏透明遮罩接管拖拽：鼠标移到游戏画面上也能继续跟踪
        showDragOverlay();
        updateDragAt(listEl, vertical, e.clientX, e.clientY);
      });
      listEl.addEventListener('drop', function (e) {
        if (!dragState) return;
        e.preventDefault();
        finishDrag();
      });
    }

    function reorderTab(tabId, insertIndex) {
      const from = tabs.findIndex(function (t) { return t.id === tabId; });
      if (from < 0) return;
      const moved = tabs.splice(from, 1)[0];
      // insertIndex 已经是「排除被拖动项之后」的位置，直接插入即可
      const idx = Math.max(0, Math.min(tabs.length, insertIndex));
      tabs.splice(idx, 0, moved);
      tabs.forEach(function (t, i) { t.index = i + 1; });
      renderTabs();
    }

    // 账号列表拖动换顺序（与侧边标签栏同一套 ghost / 占位块 / 插入线）
    function reorderAccount(accountId, insertIndex) {
      const visible = accounts.filter(function (a) { return a.qq; });
      const from = visible.findIndex(function (a) { return String(a.id) === String(accountId); });
      if (from < 0) return;
      const moved = visible.splice(from, 1)[0];
      const idx = Math.max(0, Math.min(visible.length, insertIndex));
      visible.splice(idx, 0, moved);
      // 只重排可见账号，保持其它记录位置不变
      let vi = 0;
      accounts = accounts.map(function (a) { return a.qq ? visible[vi++] : a; });
      renderAccountSidebar();
      try { window.gameAPI.saveAccounts(accounts); } catch (e) {}
    }

    function bindAccountDrag(el, account) {
      el.draggable = true;
      // 按钮 / 下拉框不参与拖拽，避免影响点击和选择区服
      Array.prototype.forEach.call(el.querySelectorAll('button, select, input'), function (c) {
        try { c.setAttribute('draggable', 'false'); } catch (e) {}
      });
      el.addEventListener('dragstart', function (e) {
        const r = el.getBoundingClientRect();
        dragState = {
          accountId: String(account.id), dropped: false, hidePending: true,
          over: null, preview: null, lastX: e.clientX, lastY: e.clientY,
          sourceEl: el, placeholder: null
        };
        try {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(account.id));
          const blank = document.createElement('img');
          blank.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
          blank.style.position = 'fixed';
          blank.style.left = '-10px';
          blank.style.top = '-10px';
          blank.style.width = '1px';
          blank.style.height = '1px';
          document.body.appendChild(blank);
          e.dataTransfer.setDragImage(blank, 0, 0);
          setTimeout(function () { if (blank.parentNode) blank.parentNode.removeChild(blank); }, 0);
        } catch (err) {}
        const cs = window.getComputedStyle(el);
        const ph = document.createElement('div');
        ph.className = 'tab-placeholder';
        ph.style.width = r.width + 'px';
        ph.style.height = r.height + 'px';
        ph.style.flex = '0 0 auto';
        ph.style.margin = cs.margin;
        ph.style.boxSizing = 'border-box';
        dragState.placeholder = ph;
        const ghost = el.cloneNode(true);
        ghost.classList.add('tab-drag-ghost');
        ghost.style.width = r.width + 'px';
        ghost.style.height = r.height + 'px';
        ghost.style.left = r.left + 'px';
        ghost.style.top = r.top + 'px';
        ghost.style.boxSizing = 'border-box';
        ghost.style.margin = '0';
        document.body.appendChild(ghost);
        dragState.ghost = ghost;
        dragState.ghostW = r.width;
        dragState.ghostH = r.height;
        dragState.grabDX = e.clientX - r.left;
        dragState.grabDY = e.clientY - r.top;
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', function (e) {
        el.classList.remove('dragging');
        cleanupDragPlaceholder();
        hideDropLine();
        const st = dragState;
        dragState = null;
        if (!st || st.dropped) return;
        if (st.over) {
          const r = st.over.rect;
          const fx = (e && typeof e.clientX === 'number') ? e.clientX : st.lastX;
          const fy = (e && typeof e.clientY === 'number') ? e.clientY : st.lastY;
          if (fx >= r.left && fx <= r.right && fy >= r.top && fy <= r.bottom) {
            reorderAccount(st.accountId, (st.preview && st.preview.idx != null) ? st.preview.idx : st.over.idx);
          }
        }
      });
    }

    // 账号侧边栏（同一 QQ 支持多区服凭证）
    function accountZoneKey(c) { return String((c && (c.zone_id || 'default')) || 'default'); }
    function accountZoneName(c) { return (c && (c.zone_name || c.zone_id)) || '默认区'; }
    // 顶栏标签只需要区服短名：优先取「1098区」这类前缀，避免完整区服名把标签撑长
    function shortZoneName(name) {
      const s = String(name || '').trim();
      const m = s.match(/(\d+\s*区)/);
      if (m) return m[1].replace(/\s+/g, '');
      return s.length > 6 ? s.slice(0, 6) : s;
    }
    // 账号标签短名：QQ 前四位 + 区服，如 3025-1098区
    function accountTabName(account, zoneName) {
      const qq = String((account && account.qq) || '').trim();
      const prefix = qq ? qq.slice(0, 4) : ((account && account.windowName) || '窗口');
      const zone = shortZoneName(zoneName);
      return zone ? (prefix + '-' + zone) : prefix;
    }
    function accountZoneList(a) {
      const map = (a && a.credentials && typeof a.credentials === 'object') ? a.credentials : {};
      let list = Object.keys(map).map(k => map[k]).filter(c => c && (c.login_url || c.zone_id || c.zone_name));
      if (!list.length && a && a.credential && a.credential.login_url) list.push(a.credential);
      const seen = {};
      list = list.filter(c => { const k = accountZoneKey(c); if (seen[k]) return false; seen[k] = true; return true; });
      const last = String((a && a.lastZoneId) || '');
      list.sort((x, y) => {
        const xk = accountZoneKey(x), yk = accountZoneKey(y);
        if (last && xk === last) return -1;
        if (last && yk === last) return 1;
        const xt = x.captured_at ? new Date(x.captured_at).getTime() : 0;
        const yt = y.captured_at ? new Date(y.captured_at).getTime() : 0;
        return yt - xt;
      });
      return list;
    }
    function formatCredTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const pad = function(n) { return n < 10 ? '0' + n : '' + n; };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function zoneCredStatus(cred) {
      const renewed = cred && cred.captured_at ? '上次续期：' + formatCredTime(cred.captured_at) : '';
      const withRenewed = function(s) { return renewed ? s + '｜' + renewed : s; };
      if (!cred || !cred.login_url) return { cls: '', title: '未保存凭证' };
      const exp = cred.expires_at ? new Date(cred.expires_at).getTime() : 0;
      // 明确标记失效，或本地记录的到期时间已过
      if (cred.expired_at || (exp && exp <= Date.now())) {
        return { cls: 'invalid', title: withRenewed('凭证已失效，进入时需要重新登录') };
      }
      // 会话型 skey 没有真实到期时间：约 24 小时是经验值
      if (!exp) {
        return { cls: 'saved', title: withRenewed('已保存凭证（约 24 小时，以实际登录状态为准）') };
      }
      // cookie 的到期时间只是上限，服务端可能提前作废，所以不显示具体天数
      return { cls: 'valid', title: withRenewed('凭证已保存，以实际登录状态为准') };
    }

      let html = '';
      items.forEach(function(a) {

        const lastKey = String(a.lastZoneId || '');
        const selected = zones.find(z => accountZoneKey(z) === lastKey) || zones[0] || null;
        const selectedKey = selected ? accountZoneKey(selected) : '';
        const st = zoneCredStatus(selected);
        const zoneName = selected ? accountZoneName(selected) : '';
        const title = zoneName || a.windowName || '未选区服';
        const tag = (a.windowName && a.windowName !== a.qq && a.windowName !== zoneName) ? a.windowName : '';
        let titleHtml;
        if (zones.length > 1) {
          titleHtml = '<select class="account-zone-select" data-account-id="' + a.id + '" title="选择区服">' +
            zones.map(function(z) {

                escapeHtml(accountZoneName(z)) + '</option>';

        const clearBtn = (selected && selected.login_url)

        html += '<div class="account-sidebar-item" data-account-id="' + a.id + '">' +

            '<button class="account-sidebar-action-btn delete" data-delete-id="' + a.id + '">删除</button>' +
          '</div>' +

        return;
      }

      if (target.classList.contains('edit') || target.closest('.edit')) {
        const btn = target.classList.contains('edit') ? target : target.closest('.edit');
        showEditAccountModal(btn.dataset.editId);
        return;
      }

      if (target.classList.contains('delete') || target.closest('.delete')) {
        const btn = target.classList.contains('delete') ? target : target.closest('.delete');
        window.gameAPI.removeAccount(btn.dataset.deleteId);
        return;
      }

      if (target.dataset.clearCredId || target.closest('[data-clear-cred-id]')) {
        const btn = target.dataset.clearCredId ? target : target.closest('[data-clear-cred-id]');
        try { window.gameAPI.clearCredential(btn.dataset.clearCredId, btn.dataset.clearZone || ''); } catch (err) {}
        return;
      }

      if (target.closest('.account-zone-select')) return;

      const item = target.closest('.account-sidebar-item');
      if (item) {
        const accountId = item.dataset.accountId;
        window.gameAPI.fillAccount(accountId);
      }
    });

    document.getElementById('account-sidebar-list').addEventListener('change', (e) => {
      const sel = e.target.closest('.account-zone-select');
      if (!sel) return;
      const accountId = sel.dataset.accountId;
      const zoneId = sel.value;
      const acc = accounts.find(a => a.id === accountId);
      if (acc) {
        acc.lastZoneId = zoneId;
        try { window.gameAPI.setAccountZone(accountId, zoneId); } catch (err) {}
        renderAccountSidebar();
      }
    });

    // IPC 事件监听
    ipcRenderer.on('accounts-update', (event, accountList) => {
      accounts = accountList || [];
      renderAccountSidebar();
    });

    // 主进程抓到新凭证后通知刷新账号栏
    ipcRenderer.on('accounts-changed', () => {
      try { window.gameAPI.getAccounts(); } catch (e) {}
    });

    ipcRenderer.on('theme-update', (event, colors) => {
      applyTheme(colors);
    });

    ipcRenderer.on('speed-update', (event, speed) => {
      syncSpeedUI(speed);
    });

    ipcRenderer.on('mute-update', (event, muted) => {
      isMuted = !!muted;
      syncMuteLabel();
    });

    // 界面缩放只影响侧栏/弹窗等覆盖层，不参与 Flash 渲染
    ipcRenderer.on('ui-scale-update', (event, v) => {
      uiScale = Math.max(1, Number(v) || 1);
      applyUiScaleVars();
    });

    // 窗口透明度变化（主进程统一下发）
    ipcRenderer.on('opacity-state', (event, pct) => {
      setOpacityUI(pct);
    });

    ipcRenderer.on('fullscreen-changed', (event, on) => {
      document.body.classList.toggle('fullscreen', !!on);
      applyUiScaleVars();
      syncGuestResize();
    });

    // 最大化 ≠ 全屏：最大化保留工具栏、任务栏可见；全屏才隐藏工具栏
    function applyWindowState(state) {
      const s = state || {};
      const fs = !!s.fullscreen;
      const max = !!s.maximized && !fs;
      document.body.classList.toggle('fullscreen', fs);
      document.body.classList.toggle('maximized', max);
      const btn = document.getElementById('btn-max');
      if (btn) {
        btn.innerHTML = max ? '&#10064;' : '&#9744;';
        btn.title = max ? '还原' : '最大化';
      }
      applyUiScaleVars();
    }

    ipcRenderer.on('window-state', (event, state) => {
      applyWindowState(state);
      // 最大化 / 还原 / 全屏切换时容器尺寸分几帧才稳定，多补几次重排
      syncGuestResize();
      setTimeout(syncGuestResize, 120);
      setTimeout(syncGuestResize, 350);
    });

    ipcRenderer.on('game-info', (event, data) => {
      diskCache = (data.diskCache !== false);
      windowSlot = data.windowSlot || 1;
      currentGame = data.game;
      accounts = data.accounts || [];
      renderConfig = normalizeRenderConfig(data.renderConfig);
      flashQuality = normalizeFlashQuality(data.flashQuality);
      uiScale = Math.max(1, Number(data.uiScale) || 1);
      setOpacityUI(data.gameOpacity == null ? 100 : Math.round(Number(data.gameOpacity) * 100));
      applyUiScaleVars();
      document.title = data.game.name;
      document.getElementById('windowTitle').textContent = data.game.name;
      // 恢复上次选择的标签栏模式（侧边 / 顶栏），不回写配置
      setTabDisplayMode(data.tabDisplayMode === 'taskbar' ? 'taskbar' : 'sidebar', false);

      const initialAccount = data.account || null;
      let initialName = '窗口1';
      if (initialAccount) {
        const cred = initialAccount.credential;
        const zoneName = cred && (cred.zone_name || cred.zone_id);
        initialName = accountTabName(initialAccount, zoneName);
      }
      addTab(initialName, initialAccount);
    });

    ipcRenderer.on('flash-quality-update', (event, quality) => {
      flashQuality = normalizeFlashQuality(quality);
      // 画质由 preload 在 embed 创建时生效；已有页面不强行改写（Flash 创建后改 quality 基本无效）
    });

    ipcRenderer.on('render-config-update', (event, cfg) => {
      renderConfig = normalizeRenderConfig(cfg);
      // 配置变化时所有标签同步切换逻辑宽度（窗口大小不变，游戏按新宽度重新排版）
      tabs.forEach(function (t) {
        t._stageW = renderConfig.width;
        t._appliedZoom = 0;
        t._renderKey = null;
      });
      applyRenderConfig();
    });

    ipcRenderer.on('launch-account', (event, account) => {
      // 必须把完整账号对象（含 credential / id）带进新标签，否则只能填账号密码，
      // 自动保存的凭证账号没有密码就进不去。
      const cred = account && account.credential;
      const zoneName = cred && (cred.zone_name || cred.zone_id);
      addTab(accountTabName(account, zoneName), account);
    });

    ipcRenderer.on('window-blur', () => {
      isWindowActive = false;
      tabs.forEach(tab => {
        if (tab._webview && tab.id !== activeTabId) {
          tab._webview.classList.add('paused');
        }
        if (tab.id !== activeTabId) setTabThrottle(tab, true);
      });
    });

    // 窗口重新可用（聚焦 / 从最小化恢复）：活跃标签必须解除 paused 并恢复声音，
    // 否则 webview 还是 pointer-events:none，游戏里点任何地方都没反应。
    function markWindowActive() {
      isWindowActive = true;
      tabs.forEach(tab => {
        if (!tab._webview) return;
        const active = tab.id === activeTabId;
        tab._webview.classList.remove('paused');
        if (active) {
          if (!isMuted) {
            try { tab._webview.setAudioMuted(false); } catch (e) {}
          }
        } else {
          try { tab._webview.setAudioMuted(true); } catch (e) {}
        }
        setTabThrottle(tab, !active);
      });
    }

    ipcRenderer.on('window-focus', () => {
      markWindowActive();
    });

    ipcRenderer.on('window-minimized', () => {
      isWindowActive = false;
      tabs.forEach(tab => {
        if (tab._webview) {
          tab._webview.classList.add('paused');
          try { tab._webview.setAudioMuted(true); } catch (e) {}
        }
      });
    });

    ipcRenderer.on('window-restored', () => {
      markWindowActive();
      syncGuestResize();
    });

    // 宿主窗口尺寸变化：每帧跟随一次，停手后校验 guest 视口
    let hostResizeRaf = 0;
    let guestCheckTimer = null;
    let guestCheckRetries = 0;
    function syncGuestResize() {
      if (!hostResizeRaf) {
        hostResizeRaf = requestAnimationFrame(function () {
          hostResizeRaf = 0;
          applyRenderConfig();
        });
      }
      guestCheckRetries = 0;
      if (guestCheckTimer) clearTimeout(guestCheckTimer);
      guestCheckTimer = setTimeout(function () {
        guestCheckTimer = null;
        verifyGuestViewport();
      }, 250);
    }

    // 与 2.2.0 相同的关键算法：缩放倍率向上取 1/8 步进（1.125 / 1.25 / 1.375 / 1.5 …），
    // 这样 tile 边界始终落在整数像素上，地图方块之间不会出现细黑线。
    // zoom 只在 ≥1 时使用（不缩小），且保证逻辑视口不超过所选分辨率（不会渲染出黑边）。
    function computeRenderTarget(stageWidth) {
      const cw = Math.max(1, container ? container.clientWidth : window.innerWidth);
      const ch = Math.max(1, container ? container.clientHeight : window.innerHeight);
      const stageW = Math.max(640, Math.min(1920, stageWidth || (renderConfig && renderConfig.width) || 1600));
      const stageH = Math.round(stageW * 9 / 16);
      const raw = Math.max(cw / stageW, ch / stageH);
      const zoom = Math.max(1, Math.min(4, Math.ceil(raw * 8 - 1e-6) / 8));
      return {
        stageW: Math.max(640, Math.round(cw / zoom)),
        stageH: Math.max(360, Math.round(ch / zoom)),
        zoom: zoom,
        k: zoom,
        cw: cw,
        ch: ch,
        dx: 0,
        dy: 0
      };
    }

    // 把一个标签的 webview 元素铺满窗口，并用页面缩放把逻辑视口宽度锁到舞台宽度
    function paintStage(tab) {
      const el = tab && tab._webview;
      if (!el) return null;
      const t = computeRenderTarget(tab._stageW);
      const key = t.stageW + ':' + t.cw + 'x' + t.ch;
      if (tab._renderKey !== key) {
        tab._renderKey = key;
        el.style.width = '100%';
        el.style.height = '100%';
        el.style.left = '0px';
        el.style.top = '0px';
        el.style.transform = 'none';
        el.style.transformOrigin = '0 0';
      }
      if (Math.abs((tab._appliedZoom || 0) - t.zoom) > 1e-6) {
        try {
          el.setZoomFactor(t.zoom);
          tab._appliedZoom = t.zoom;
        } catch (e) { /* guest 尚未附加，dom-ready / did-stop-loading 会再设 */ }
      }
      return t;
    }

    function applyRenderConfig() {
      let active = null;
      tabs.forEach(function (tab) {
        const t = paintStage(tab);
        if (t && tab.id === activeTabId) active = t;
      });
      const t = active || computeRenderTarget();

      window.__narutoRender = {
        stageW: t.stageW,
        stageH: t.stageH,
        scale: t.zoom,
        zoom: t.zoom,
        cw: t.cw,
        ch: t.ch,
        offset: { x: 0, y: 0 },
        dpr: window.devicePixelRatio
      };
    }

    // 校验 guest 的逻辑视口是否等于目标（宽 = 舞台宽度，高按窗口比例）
    function verifyGuestViewport() {
      const tab = tabs.find(function (x) { return x.id === activeTabId; }) || tabs[0];
      if (!tab || !tab._webview) return;
      const t = computeRenderTarget(tab._stageW);
      const el = tab._webview;
      const kick = function () {
        try { el.executeJavaScript('window.dispatchEvent(new Event("resize"))').catch(function () {}); } catch (e) {}
      };
      kick();
      try {
        el.executeJavaScript('({w:innerWidth,h:innerHeight})').then(function (r) {
          if (!r) return;
          const bad = Math.abs(r.w - t.stageW) > 2 || Math.abs(r.h - t.stageH) > 2;
          window.__narutoRender = Object.assign({}, window.__narutoRender, {
            guest: r,
            expected: { w: t.stageW, h: t.stageH },
            bad: bad
          });
          if (!bad) return;
          window.gameAPI.debugLog('warn', 'render',
            'guest 视口未同步 ' + r.w + 'x' + r.h + '，应为 ' + t.stageW + 'x' + t.stageH + '，强制重排');
          // 缩放没跟上就重新应用一次；再轻推一次高度让页面真正 relayout
          tab._appliedZoom = 0;
          paintStage(tab);
          el.style.height = '99.9%';
          requestAnimationFrame(function () {
            el.style.height = '100%';
            try { el.invalidate(); } catch (e) {}
          });
          setTimeout(kick, 120);
          if (guestCheckRetries < 2) {
            guestCheckRetries++;
            setTimeout(function () {
              if (!guestCheckTimer) verifyGuestViewport();
            }, 420);
          }
        }).catch(function () {});
      } catch (e) {}
    }

    window.addEventListener('resize', syncGuestResize);

    // ---------- 全局快捷键（主进程 before-input-event 统一拦截后发过来）----------
    function cycleTab(dir) {
      if (!tabs.length) return;
      const i = tabs.findIndex(function (t) { return t.id === activeTabId; });
      const n = tabs.length;
      const next = tabs[((i < 0 ? 0 : i) + dir + n) % n];
      if (next) switchTab(next.id);
    }

    // 启动器 UI 都关闭后，把 Esc 转发给当前游戏页，交给游戏关闭自己的窗口
    function forwardEscapeToGame() {
      const tab = tabs.find(function (t) { return t.id === activeTabId; });
      if (!tab || !tab._webview) return;
      try { tab._webview.focus(); } catch (e) {}
      try {
        const id = tab._webview.getWebContentsId();
        if (id) ipcRenderer.send('send-escape-to-guest', id);
      } catch (e) {}
    }

    ipcRenderer.on('shortcut', function (e, action) {
      if (!action) return;

      if (action.indexOf('switch-tab:') === 0) {
        const idx = parseInt(action.split(':')[1], 10) - 1;
        const tab = tabs[idx];
        if (tab) switchTab(tab.id);
        return;
      }

      if (action === 'escape') {
        const help = document.getElementById('helpModal');
        if (help) { help.remove(); return; }
        const modal = document.querySelector('.add-account-modal');
        if (modal) {
          const cancel = document.getElementById('modalCancel');
          if (cancel) cancel.click(); else modal.remove();
          return;
        }
        if (openSidebar) { setSidebar(null); return; }
        if (dragState) {
          cleanupDragPlaceholder();
          hideDropLine();
          hideDragOverlay();
          dragState = null;
          return;
        }
        forwardEscapeToGame();
        return;
      }

      if (action === 'new-tab') { addTab(); return; }
      if (action === 'close-tab') { if (activeTabId) removeTab(activeTabId); return; }
      if (action === 'next-tab') { cycleTab(1); return; }
      if (action === 'prev-tab') { cycleTab(-1); return; }
      if (action === 'toggle-tabs') { setSidebar('tabs'); return; }
      if (action === 'toggle-accounts') { setSidebar('accounts'); return; }
      if (action === 'refresh') { try { window.gameAPI.refreshPage(); } catch (err) {} return; }
      if (action === 'mute') { toggleMute(); return; }
      if (action === 'more') { setSidebar('more'); return; }
      if (action === 'fullscreen') { ipcRenderer.send('toggle-fullscreen'); return; }
      if (action === 'close-window') { try { window.gameAPI.closeWindow(); } catch (err) {} }
    });

    // 主题应用：颜色由主进程统一下发（main.js 的 THEMES 是唯一数据源）
    function applyTheme(c) {
      if (!c) return;
      const root = document.documentElement;
      root.style.setProperty('--bg1', c.bg1);
      root.style.setProperty('--bg2', c.bg2);
      root.style.setProperty('--border', c.border);
      root.style.setProperty('--text', c.text);
      root.style.setProperty('--sub', c.sub);
      root.style.setProperty('--btnBg', c.btnBg);
      root.style.setProperty('--btnHover', c.btnHover);
      root.style.setProperty('--btnBorder', c.btnBorder);
      root.style.setProperty('--separator', c.separator);
      root.style.setProperty('--accent', c.accent);
    }

    // 页面加载完成后请求游戏信息
    document.addEventListener('DOMContentLoaded', () => {
      // 等待主进程发送游戏信息
    });
  </script>
</body>
</html>
