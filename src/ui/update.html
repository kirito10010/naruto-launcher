<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #ffffff; }
  body {
    font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
    color: #2c3e50;
    padding: 20px 22px 18px;
    user-select: none;
  }
  .title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .badge {
    background: #e74c3c; color: #fff; font-size: 11px;
    padding: 2px 8px; border-radius: 9px; font-weight: 400;
  }
  .versions { margin-top: 8px; font-size: 12.5px; color: #7f8c8d; }
  .versions b { color: #2c3e50; font-weight: 600; }
  .divider { height: 1px; background: #eceff1; margin: 14px 0 12px; }
  .notes-label { font-size: 12.5px; color: #95a5a6; margin-bottom: 6px; }
  .notes {
    font-size: 13px; line-height: 1.7; color: #34495e;
    white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
  }
  .buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  button {
    font-family: inherit; font-size: 13px; padding: 8px 18px;
    border-radius: 6px; border: 1px solid #dcdfe6;
    background: #fff; color: #5a6c7d; cursor: pointer; outline: none;
  }
  button:hover { background: #f5f7fa; }
  button.primary { background: #3498db; border-color: #3498db; color: #fff; font-weight: 600; }
  button.primary:hover { background: #2f89c5; }
</style>
</head>
<body>
  <div class="title">发现新版本 <span class="badge" id="latest">v-</span></div>
  <div class="versions">当前版本 <b id="cur">v-</b> &nbsp;→&nbsp; 最新版本 <b id="new">v-</b></div>
  <div class="divider"></div>
  <div class="notes-label">更新内容</div>
  <div class="notes" id="notes"></div>
  <div class="buttons">
    <button id="later">稍后提醒</button>
    <button id="update" class="primary">立即更新</button>
  </div>

<script>
  const ipcRenderer = (() => { try { return require('electron').ipcRenderer; } catch (e) { return null; } })();
  const PREVIEW = !ipcRenderer;              // 直接用浏览器打开时为预览模式
  const ipc = ipcRenderer || { send: () => {}, on: () => {} };
  const LINE_H = 22.1; // 13px * 1.7

  let info = null;
  let maxH = 520;

  function render() {
    document.getElementById('cur').textContent = 'v' + (info.current || '');
    document.getElementById('new').textContent = 'v' + (info.latest || '');
    document.getElementById('latest').textContent = 'v' + (info.latest || '');
    document.getElementById('notes').textContent = info.notes || '暂无更新说明';
    maxH = info.maxHeight || maxH;
    requestAnimationFrame(fitHeight);
  }

  // 自适应高度：按内容自然高度撑开窗口；超上限时用 line-clamp 截断（绝不出现滚动条）
  function fitHeight() {
    const notes = document.getElementById('notes');
    notes.style.webkitLineClamp = 'unset';
    notes.style.maxHeight = 'none';

    const natural = document.body.scrollHeight;
    let h = natural;

    if (natural > maxH) {
      h = maxH;
      const others = natural - notes.scrollHeight;          // 标题/版本/按钮等占的高度
      const avail = Math.max(40, maxH - others);            // 留给说明区的高度
      notes.style.maxHeight = avail + 'px';
      notes.style.webkitLineClamp = String(Math.max(1, Math.floor(avail / LINE_H)));
    }
    ipc.send('update-window-height', Math.round(h));
    if (PREVIEW) document.title = '预览高度 ' + Math.round(h) + 'px';
  }

  ipc.on('update-info', (e, data) => { info = data; render(); });
  document.getElementById('update').addEventListener('click', () => ipc.send('update-action', 'update'));
  document.getElementById('later').addEventListener('click', () => ipc.send('update-action', 'later'));

  if (PREVIEW) {
    info = {
      current: '1.0.0',
      latest: '1.0.1',
      maxHeight: 520,
      notes: '【新增】组织数据一键导出（每周日抓包自动生成 6 个 Excel）\n【优化】移除帧率锁与垂直同步，解决长时间游玩越来越卡的问题\n【优化】更新下载走国内加速，速度大幅提升\n【修复】更新弹窗点「立即更新」后没有进度显示的问题\n【修复】可以无限双击启动启动器的问题，现在只允许单实例'
    };
    render();
  }
</script>
</body>
</html>
